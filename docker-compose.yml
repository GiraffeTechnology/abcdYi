version: "3.9"

# Container-internal ports only. Docker publishes each one on a free host port
# (never a fixed one); find it with `docker compose port <service> <port>`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giraffe
      POSTGRES_PASSWORD: giraffe
      POSTGRES_DB: apparel_textile
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giraffe"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://giraffe:giraffe@db:5432/apparel_textile
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://giraffe:giraffe@db:5432/apparel_textile
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    command: uv run alembic upgrade head

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://giraffe:giraffe@db:5432/apparel_textile
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://giraffe:giraffe@db:5432/apparel_textile
      SECRET_KEY: change-me-in-production
    ports:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    environment:
      VITE_DEV_PORT: "5173"
    ports:
      - "5173"
    depends_on:
      - api

volumes:
  pgdata:
